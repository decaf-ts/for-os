name: Publish on Release

# Keep this filename aligned with the npm trusted-publisher configuration.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - run: npm run test:all
      - run: npm run for-os:integrity:check

  native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: tray-icon-node.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            binary: tray-icon-node.linux-arm64-gnu.node
          # Temporarily disabled: the Intel macOS runner is not starting.
          # Re-enable when a supported macOS Intel runner is available.
          # - target: x86_64-apple-darwin
          #   runner: macos-13
          #   binary: tray-icon-node.darwin-x64.node
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: tray-icon-node.darwin-arm64.node
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            binary: tray-icon-node.win32-x64-msvc.node
          - target: i686-pc-windows-msvc
            runner: windows-2022
            binary: tray-icon-node.win32-ia32-msvc.node
    runs-on: ${{ matrix.runner }}
    env:
      # GitHub's Windows checkout otherwise normalizes the vendored LF-pinned
      # Rust sources before the integrity check in for-os-build runs.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: Install Linux native build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-3-dev libayatana-appindicator3-dev libglib2.0-dev libxdo-dev libx11-dev
      - name: Build addon
        run: node scripts/for-os-build.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/tray-icon-node/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  docs:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: [native, validate, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/tray-icon-node
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run for-os:package:check
      - name: Publish package with npm trusted publishing
        run: npm publish --provenance --access public
