name: for-os Native Addon

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "native/tray-icon-node/**"
      - ".github/workflows/for-os-native.yml"
  push:
    branches: [master, main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "scripts/**"
      - "native/tray-icon-node/**"
      - ".github/workflows/for-os-native.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.100.0"

concurrency:
  group: for-os-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-addon:
    name: Build and smoke native addon
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pinned Rust toolchain matches for-os-init.mjs
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^const RUST_TOOLCHAIN = "\([^"]*\)";.*/\1/p' scripts/for-os-init.mjs)"
          if [ -z "$pinned" ] || [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::for-os-init.mjs pins Rust ${pinned:-unknown}, expected $RUST_TOOLCHAIN"
            exit 1
          fi

      - name: Install Linux native build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            libglib2.0-dev libxdo-dev libx11-dev libnotify-bin xvfb xauth dbus-x11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tray-icon-node/target
          key: for-os-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('native/tray-icon-node/Cargo.lock') }}
          restore-keys: |
            for-os-cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Install pinned Rust and check build prerequisites
        run: |
          set -euo pipefail
          npm run for-os:init -- --skip-build
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          rustc --version
          npm run for-os:init:check

      - name: Verify native source integrity
        run: npm run for-os:integrity:check

      - name: Test native notification and tray contracts
        run: npm run for-os:test:rust

      - name: Build native addon
        run: npm run for-os:build

      - name: Verify native build
        run: npm run for-os:build:check

      - name: Smoke tray and notifications under Xvfb and D-Bus
        env:
          FOR_OS_TRAY_TEST_TIMEOUT_MS: "30000"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dbus-run-session -- npm run for-os:smoke
